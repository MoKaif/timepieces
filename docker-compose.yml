services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timepieces
      POSTGRES_USER: timepieces
      POSTGRES_PASSWORD: timepieces
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timepieces -d timepieces"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://timepieces:timepieces@db:5432/timepieces
      PORT: 3000
    ports:
      - "${TIMEPIECES_PORT:-3002}:3000"
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile && pnpm dev --host"
    volumes:
      - ./:/app
    working_dir: /app

volumes:
  postgres_data:
